<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="open.title">Opening paper...</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="style.css">

<body class="opening">

  <p id="msg">Preparing...</p>
  <p><a id="fallback" hidden data-i18n="open.fallback">Open the PDF the normal way</a></p>

  <div><button id="inchrome" hidden data-i18n="open.inchrome">Open in Chrome instead</button></div>

  <script src="common.js"></script>
  <script src="open.js"></script>
