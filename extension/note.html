<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="note.title">Note</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script src="i18n.js"></script>
  <script src="theme.js"></script>
</head>
<body class="note-page" data-page="note">
  <header>
    <h1><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path class="ring" d="M2.8 20.8 A14 5 -20 0 1 29.2 11.2" stroke-width="2.6"/><path class="head" d="M8.6 12 L9 3.5 L14.5 8 Z M23.4 12 L23 3.5 L17.5 8 Z" stroke-width="1.5" stroke-linejoin="round"/><circle class="head" cx="16" cy="16" r="9" stroke-width="0"/><path class="ring" d="M29.2 11.2 A14 5 -20 0 1 2.8 20.8" stroke-width="2.6"/></svg><span data-i18n="note.title">Note</span></h1>
    <div class="header-actions">
      <label class="switch" data-i18n-title="lib.handle.tip" title="On: Papurr snatches PDF links, saves the paper in your folder and opens it. Off: PDF links behave as usual and nothing is saved.">
        <input type="checkbox" id="capture-toggle" checked> <span data-i18n="lib.handle">Snatch PDF links</span>
      </label>
      <a class="ghost" href="library.html" data-i18n="opt.back">Library</a>
      <a class="ghost" href="today.html" data-i18n="lib.today">Today's arXiv</a>
      <a class="ghost inspire-link" href="https://inspirehep.net/" target="_blank" rel="noopener noreferrer" data-i18n-title="lib.inspire.tip" title="Open INSPIRE (in a new tab)"><span class="inspire-pill" data-i18n="lib.inspire">INSPIRE</span><svg class="ext-ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5H2.5v7h7v-2M7 2.5h2.5V5M9.5 2.5L5.5 6.5"/></svg></a>
      <a class="ghost" href="options.html" data-i18n="lib.settings">Settings</a>
      <a class="ghost" href="help.html" data-i18n="lib.help">Help</a>
    </div>
  </header>
  <div id="paper" hidden>
    <h2 id="paper-title"></h2>
    <div id="paper-meta" class="meta"></div>
    <div id="paper-links" class="paper-row"></div>
  </div>
  <div id="msg">Loading...</div>
  <div id="copies" class="notice" hidden></div>
  <div id="conflict" class="notice" hidden>
    <p id="conflict-text"></p>
    <button id="conflict-reload"></button>
    <button id="conflict-overwrite"></button>
  </div>
  <button id="grant" hidden data-i18n="grant.button">Grant access to the folder</button>
  <p id="grant-hint" class="muted" hidden data-i18n="grant.hint">Tip: if Chrome offers “Allow on every visit”, choose it to avoid being asked again.</p>
  <section id="summary-panel" class="note-ai" hidden></section>
  <div id="blocks"></div>
  <section id="mine" hidden>
    <div class="section-head">
      <h3 id="mine-title"></h3>
      <div class="actions">
        <span id="mine-move" class="move"></span>
        <button id="edit"></button>
        <button id="save" hidden></button>
        <button id="cancel" hidden></button>
      </div>
    </div>
    <div id="mine-view" class="md"></div>
    <textarea id="mine-edit" hidden spellcheck="false"></textarea>
    <p id="save-hint" class="muted" hidden></p>
  </section>
  <footer id="file-row" class="paper-row" hidden>
    <span id="file-name" class="muted"></span>
    <span class="dbs">
      <button id="editor" class="mini"></button>
      <button id="reveal" class="mini"></button>
    </span>
  </footer>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="common.js"></script>
  <script src="ai.js"></script>
  <script src="profile.js"></script>
  <script src="reason.js"></script>
  <script src="summary.js"></script>
  <script src="translate.js"></script>
  <script src="note.js"></script>
</body>
</html>
