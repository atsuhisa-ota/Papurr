<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="lib.title">Library</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js"></script>
  <script src="theme.js"></script>
</head>
<body class="library" data-page="library">
  <div id="top">
    <header>
      <h1><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path class="ring" d="M2.8 20.8 A14 5 -20 0 1 29.2 11.2" stroke-width="2.6"/><path class="head" d="M8.6 12 L9 3.5 L14.5 8 Z M23.4 12 L23 3.5 L17.5 8 Z" stroke-width="1.5" stroke-linejoin="round"/><circle class="head" cx="16" cy="16" r="9" stroke-width="0"/><path class="ring" d="M29.2 11.2 A14 5 -20 0 1 2.8 20.8" stroke-width="2.6"/></svg><span data-i18n="lib.title">Library</span></h1>
      <div class="header-actions">
        <label class="switch" data-i18n-title="lib.handle.tip" title="On: Papurr snatches PDF links, saves the paper in your folder and opens it. Off: PDF links behave as usual and nothing is saved.">
          <input type="checkbox" id="capture-toggle" checked> <span data-i18n="lib.handle">Snatch PDF links</span>
        </label>
        <a class="ghost" href="library.html" data-i18n="opt.back">Library</a>
        <a class="ghost" href="today.html" data-i18n="lib.today">Today's arXiv</a>
        <a class="ghost" href="inspire.html" data-i18n="lib.inspire" data-i18n-title="lib.inspire.tip" title="Search INSPIRE">INSPIRE</a>
        <a class="ghost" href="options.html" data-i18n="lib.settings">Settings</a>
        <a class="ghost" href="help.html" data-i18n="lib.help">Help</a>
      </div>
    </header>
    <div class="search-row">
      <input id="search" type="search" placeholder="Search by author" autofocus>
      <select id="search-scope" data-i18n-title="search.scope.tip" title="Where to search">
        <option value="authors" data-i18n="search.scope.authors">Authors</option>
        <option value="title" data-i18n="search.scope.title">Title</option>
        <option value="number" data-i18n="search.scope.number">arXiv number</option>
        <option value="tag" data-i18n="search.scope.tag">Tag</option>
        <option value="notes" data-i18n="search.scope.notes">Notes</option>
      </select>
    </div>
    <div class="toolbar">
      <div class="group">
        <label for="sort-key" data-i18n="sort.label">Sort by</label>
        <select id="sort-key">
          <option value="added" data-i18n="sort.added">Date saved</option>
          <option value="opened" data-i18n="sort.opened">Last opened</option>
          <option value="title" data-i18n="sort.title">Title</option>
          <option value="author" data-i18n="sort.author">First author</option>
          <option value="arxiv" data-i18n="sort.arxiv">arXiv number</option>
          <option value="note" data-i18n="sort.note">Note updated</option>
        </select>
        <button id="sort-dir" class="icon-btn" data-i18n-title="sort.tip" title="Toggle ascending / descending"></button>
        <select id="note-filter" data-i18n-title="filter.tip" title="Show only some of the papers">
          <option value="all" data-i18n="filter.all">All papers</option>
          <option value="note" data-i18n="filter.note">With a note</option>
          <option value="summary" data-i18n="filter.summary">With a summary</option>
          <option value="mine" data-i18n="filter.mine">My papers</option>
        </select>
      </div>
      <div class="group">
        <button id="manage-tags" data-i18n="tags.manage">Manage tags</button>
        <button id="rebuild" hidden data-i18n="index.update">Update index</button>
        <button id="cancel-rebuild" hidden data-i18n="common.cancel">Cancel</button>
      </div>
    </div>
    <div id="tagbar"></div>
    <input id="tag-filter" type="search" data-i18n-placeholder="tags.filter.placeholder" placeholder="Filter tags" hidden>
    <div id="tag-manager" hidden></div>
    <div id="recovery" hidden></div>
    <div id="import-banner" hidden></div>
    <datalist id="tag-list"></datalist>
    <div id="msg">Loading...</div>
    <div id="index-time" class="status"></div>
    <button id="grant" hidden data-i18n="grant.button">Grant access to the folder</button>
    <p id="grant-hint" class="muted" hidden data-i18n="grant.hint">Tip: if Chrome offers “Allow on every visit”, choose it to avoid being asked again.</p>
  </div>
  <div id="list"></div>
  <script src="common.js"></script>
  <script src="import.js"></script>
  <script src="ai.js"></script>
  <script src="profile.js"></script>
  <script src="library.js"></script>
</body>
</html>
